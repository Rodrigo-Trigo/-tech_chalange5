apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-slo
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  slo-donation.json: |
    {
      "title": "SolidaryTech - SLO donation-service",
      "timezone": "browser",
      "refresh": "10s",
      "panels": [
        {
          "type": "stat",
          "title": "SLI: Taxa de Sucesso (janela 1h)",
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 0},
          "targets": [{
            "expr": "sum(rate(http_requests_total{route=\"/donations\",status!~\"5..\"}[1h])) / sum(rate(http_requests_total{route=\"/donations\"}[1h])) * 100"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "orange", "value": 99},
                  {"color": "green", "value": 99.9}
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "SLO Alvo",
          "gridPos": {"h": 6, "w": 4, "x": 8, "y": 0},
          "targets": [{"expr": "vector(99.9)"}],
          "fieldConfig": {"defaults": {"unit": "percent"}}
        },
        {
          "type": "stat",
          "title": "SLI: Latência p95 (donation-service)",
          "gridPos": {"h": 6, "w": 6, "x": 12, "y": 0},
          "targets": [{
            "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{route=\"/donations\"}[5m])) by (le))"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 0.3},
                  {"color": "red", "value": 0.5}
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "SLI: Latência p99 (donation-service)",
          "gridPos": {"h": 6, "w": 6, "x": 18, "y": 0},
          "targets": [{
            "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{route=\"/donations\"}[5m])) by (le))"
          }],
          "fieldConfig": {"defaults": {"unit": "s"}}
        },
        {
          "type": "timeseries",
          "title": "Error Budget consumido (janela 1h, SLO 99.9%)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 6},
          "targets": [{
            "expr": "(1 - (sum(rate(http_requests_total{route=\"/donations\",status!~\"5..\"}[1h])) / sum(rate(http_requests_total{route=\"/donations\"}[1h])))) / (1 - 0.999) * 100",
            "legendFormat": "% do orçamento de erro consumido"
          }],
          "fieldConfig": {"defaults": {"unit": "percent"}}
        },
        {
          "type": "timeseries",
          "title": "Taxa de Requisições por Status (donation-service)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 6},
          "targets": [{
            "expr": "sum(rate(http_requests_total{route=\"/donations\"}[5m])) by (status)",
            "legendFormat": "{{status}}"
          }]
        },
        {
          "type": "timeseries",
          "title": "Latência (p50 / p95 / p99) ao longo do tempo",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 14},
          "targets": [
            {"expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{route=\"/donations\"}[5m])) by (le))", "legendFormat": "p50"},
            {"expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{route=\"/donations\"}[5m])) by (le))", "legendFormat": "p95"},
            {"expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{route=\"/donations\"}[5m])) by (le))", "legendFormat": "p99"}
          ],
          "fieldConfig": {"defaults": {"unit": "s"}}
        }
      ],
      "schemaVersion": 39
    }