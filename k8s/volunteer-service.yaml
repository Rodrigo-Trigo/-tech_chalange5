apiVersion: apps/v1
kind: Deployment
metadata:
  name: volunteer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volunteer-service
  template:
    metadata:
      labels:
        app: volunteer-service
    spec:
      containers:
        - name: volunteer-service
          image: 636589322874.dkr.ecr.us-east-1.amazonaws.com/solidarytech/volunteer-service:latest
          ports:
            - containerPort: 8083
          env:
            - name: PORT
              value: "8083"
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_DYNAMODB_TABLE
              value: "SolidaryTechVolunteers"
          resources:
            requests:
              cpu: "20m"
              memory: "96Mi"
            limits:
              cpu: "100m"
              memory: "192Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: volunteer-service
spec:
  type: NodePort
  selector:
    app: volunteer-service
  ports:
    - port: 8083
      targetPort: 8083
      nodePort: 30083