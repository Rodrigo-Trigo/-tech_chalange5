apiVersion: apps/v1
kind: Deployment
metadata:
  name: donation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: donation-service
  template:
    metadata:
      labels:
        app: donation-service
    spec:
      containers:
        - name: donation-service
          image: 636589322874.dkr.ecr.us-east-1.amazonaws.com/solidarytech/donation-service:v2
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: DATABASE_URL
              value: "postgres://postgres:postgres123@solidarytech-donation-db.c0hmbe2cva3w.us-east-1.rds.amazonaws.com:5432/donation_db?sslmode=require"
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: donation-service
  labels:
    app: donation-service
spec:
  type: NodePort
  selector:
    app: donation-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      nodePort: 30082