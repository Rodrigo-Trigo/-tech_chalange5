apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-summary
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  summary.json: |
    {
      "title": "SolidaryTech - Visão Geral",
      "timezone": "browser",
      "refresh": "10s",
      "panels": [
        {
          "type": "stat",
          "title": "Cluster count",
          "gridPos": {"h": 4, "w": 4, "x": 0, "y": 0},
          "targets": [{"expr": "vector(1)"}]
        },
        {
          "type": "stat",
          "title": "Node count",
          "gridPos": {"h": 4, "w": 4, "x": 4, "y": 0},
          "targets": [{"expr": "count(kube_node_info)"}]
        },
        {
          "type": "stat",
          "title": "Pod count",
          "gridPos": {"h": 4, "w": 4, "x": 8, "y": 0},
          "targets": [{"expr": "count(kube_pod_info)"}]
        },
        {
          "type": "stat",
          "title": "Container count",
          "gridPos": {"h": 4, "w": 4, "x": 12, "y": 0},
          "targets": [{"expr": "count(kube_pod_container_info)"}]
        },
        {
          "type": "stat",
          "title": "Deployments prontos (%)",
          "gridPos": {"h": 4, "w": 4, "x": 16, "y": 0},
          "targets": [{"expr": "(sum(kube_deployment_status_replicas_available) / sum(kube_deployment_spec_replicas)) * 100"}],
          "fieldConfig": {"defaults": {"unit": "percent"}}
        },
        {
          "type": "stat",
          "title": "Pending pods",
          "gridPos": {"h": 4, "w": 4, "x": 20, "y": 0},
          "targets": [{"expr": "count(kube_pod_status_phase{phase=\"Pending\"} == 1) OR vector(0)"}],
          "fieldConfig": {"defaults": {"thresholds": {"steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}}
        },
        {
          "type": "stat",
          "title": "OOMKilled containers",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 4},
          "targets": [{"expr": "sum(kube_pod_container_status_last_terminated_reason{reason=\"OOMKilled\"}) OR vector(0)"}],
          "fieldConfig": {"defaults": {"thresholds": {"steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}]}}}
        },
        {
          "type": "stat",
          "title": "Restarts (última hora)",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 4},
          "targets": [{"expr": "sum(increase(kube_pod_container_status_restarts_total[1h]))"}]
        },
        {
          "type": "stat",
          "title": "CPU usado (cluster)",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 4},
          "targets": [{"expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"default\"}[5m]))"}],
          "fieldConfig": {"defaults": {"unit": "short"}}
        },
        {
          "type": "stat",
          "title": "Memória usada (cluster)",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 4},
          "targets": [{"expr": "sum(container_memory_working_set_bytes{namespace=\"default\"})"}],
          "fieldConfig": {"defaults": {"unit": "bytes"}}
        },
        {
          "type": "table",
          "title": "Pods em CrashLoopBackOff",
          "gridPos": {"h": 6, "w": 24, "x": 0, "y": 8},
          "targets": [{"expr": "kube_pod_container_status_waiting_reason{reason=\"CrashLoopBackOff\"} == 1", "format": "table", "instant": true}]
        }
      ],
      "schemaVersion": 39
    }